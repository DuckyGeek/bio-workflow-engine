apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bioworkflows.workflow.example.com
spec:
  group: workflow.example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      image:
                        type: string
                      command:
                        type: array
                        items:
                          type: string
                      dependsOn:
                        type: array
                        items:
                          type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                stepStatus:
                  type: object
                  additionalProperties:
                    type: string
                startTime:
                  type: string
                completionTime:
                  type: string
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: bioworkflows
    singular: bioworkflow
    kind: BioWorkflow
    shortNames:
      - bwf