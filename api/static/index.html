<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioWorkflow 引擎 - 控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: 28px;
            color: #1a1a2e;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-badge {
            background: #e8ecf1;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .user-badge .name {
            color: #4a6cf7;
        }
        .btn-logout {
            background: none;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #e74c3c;
        }
        .btn-logout:hover {
            background: #fef0ef;
        }
        .subtitle {
            color: #666;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8ecf1;
        }
        .card h2 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #1a1a2e;
        }
        .form-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .form-group {
            flex: 1;
            min-width: 200px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border 0.2s;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4a6cf7;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.1);
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            font-family: "Courier New", monospace;
            font-size: 13px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4a6cf7;
            color: white;
        }
        .btn-primary:hover {
            background: #3a5cd9;
        }
        .btn-danger {
            background: #e74c3c;
            color: white;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-success {
            background: #2ecc71;
            color: white;
        }
        .btn-success:hover {
            background: #27ae60;
        }
        .btn-warning {
            background: #f39c12;
            color: white;
        }
        .btn-warning:hover {
            background: #d68910;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }
        .btn-outline {
            background: none;
            border: 1px solid #d0d7de;
            color: #555;
        }
        .btn-outline:hover {
            background: #f0f2f5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        table th {
            text-align: left;
            padding: 12px 12px 12px 0;
            border-bottom: 2px solid #e8ecf1;
            font-weight: 600;
            color: #555;
        }
        table td {
            padding: 12px 12px 12px 0;
            border-bottom: 1px solid #f0f2f5;
            vertical-align: middle;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-Pending {
            background: #f39c12;
            color: white;
        }
        .status-Running {
            background: #3498db;
            color: white;
        }
        .status-Completed {
            background: #2ecc71;
            color: white;
        }
        .status-Failed {
            background: #e74c3c;
            color: white;
        }
        .status-unknown {
            background: #95a5a6;
            color: white;
        }
        .step-status {
            font-size: 12px;
            color: #666;
        }
        .step-status .done {
            color: #2ecc71;
        }
        .step-status .running {
            color: #3498db;
        }
        .step-status .pending {
            color: #95a5a6;
        }
        .step-status .failed {
            color: #e74c3c;
        }
        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: #999;
        }
        .refresh-btn {
            float: right;
            background: none;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 13px;
        }
        .refresh-btn:hover {
            background: #f0f2f5;
        }
        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.success {
            background: #2ecc71;
        }
        .toast.error {
            background: #e74c3c;
        }
        .toast.info {
            background: #3498db;
        }
        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h3 {
            font-size: 20px;
            color: #1a1a2e;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }
        .modal-close:hover {
            color: #333;
        }
        .code-block {
            background: #f6f8fa;
            padding: 12px 16px;
            border-radius: 8px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        /* ===== Login Modal ===== */
        .login-modal .modal {
            max-width: 420px;
        }
        .login-modal .form-group {
            margin-bottom: 12px;
        }
        .login-modal .form-row {
            gap: 8px;
        }
        .login-modal .form-row .btn {
            flex: 1;
        }
        .login-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #e8ecf1;
        }
        .login-tabs button {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #999;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .login-tabs button.active {
            color: #4a6cf7;
            border-bottom-color: #4a6cf7;
        }
        .login-tabs button:hover {
            color: #4a6cf7;
        }
        .login-form {
            display: none;
        }
        .login-form.active {
            display: block;
        }
        /* ===== 日志区域 ===== */
        .log-entry {
            padding: 4px 0;
            font-family: "Courier New", monospace;
            font-size: 12px;
            border-bottom: 1px solid #f0f2f5;
        }
        .log-entry .step-name {
            font-weight: 600;
            color: #4a6cf7;
            margin-right: 8px;
        }
        .log-entry .log-content {
            color: #333;
        }
        /* ===== 下载按钮 ===== */
        .download-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e8ecf1;
        }
        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            .form-group {
                min-width: 100%;
            }
            table {
                font-size: 12px;
            }
            table th,
            table td {
                padding: 8px 6px 8px 0;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .header-right {
                width: 100%;
                justify-content: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ===== 头部 ===== -->
    <div class="header">
        <div>
            <h1>🧬 BioWorkflow 引擎</h1>
            <p class="subtitle" style="margin-bottom:0;">面向生物信息分析的云原生工作流引擎 · 控制台</p>
        </div>
        <div class="header-right" id="headerRight">
                <span class="user-badge" id="userBadge" style="display:none;">
                    👤 <span class="name" id="usernameDisplay">admin</span>
                </span>
            <button class="btn btn-primary btn-sm" id="loginBtn" onclick="openLoginModal()">🔑 登录</button>
            <button class="btn btn-logout" id="logoutBtn" style="display:none;" onclick="logout()">退出</button>
        </div>
    </div>

    <!-- ===== Toast 通知 ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== 登录/注册弹窗 ===== -->
    <div class="modal-overlay login-modal" id="loginModal">
        <div class="modal">
            <div class="modal-header">
                <h3>🔐 账户</h3>
                <button class="modal-close" onclick="closeLoginModal()">&times;</button>
            </div>
            <div class="login-tabs">
                <button class="active" data-tab="login" onclick="switchLoginTab('login')">登录</button>
                <button data-tab="register" onclick="switchLoginTab('register')">注册</button>
            </div>
            <!-- 登录表单 -->
            <div class="login-form active" id="loginForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="loginUsername" placeholder="用户名" value="admin">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input id="loginPassword" type="password" placeholder="密码" value="admin123">
                </div>
                <button class="btn btn-primary" style="width:100%;" onclick="login()">登录</button>
                <div style="margin-top:8px;font-size:12px;color:#999;text-align:center;">
                    默认: admin/admin123 或 test/test123
                </div>
            </div>
            <!-- 注册表单 -->
            <div class="login-form" id="registerForm">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="registerUsername" placeholder="用户名">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input id="registerPassword" type="password" placeholder="密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input id="registerPassword2" type="password" placeholder="确认密码">
                </div>
                <button class="btn btn-success" style="width:100%;" onclick="register()">注册</button>
            </div>
        </div>
    </div>

    <!-- ===== 工作流详情弹窗 ===== -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="detailTitle">工作流详情</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="detailContent">
                <div class="empty-state">加载中...</div>
            </div>
            <div class="download-section">
                <button class="btn btn-success btn-sm" onclick="downloadResult()">📥 下载结果</button>
                <button class="btn btn-primary btn-sm" onclick="viewLogs()">📋 查看日志</button>
                <span id="downloadStatus" style="font-size:12px;color:#999;margin-left:12px;"></span>
            </div>
        </div>
    </div>

    <!-- ===== 日志弹窗 ===== -->
    <div class="modal-overlay" id="logModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="logTitle">📋 工作流日志</h3>
                <button class="modal-close" onclick="closeLogModal()">&times;</button>
            </div>
            <div id="logContent">
                <div class="empty-state">加载中...</div>
            </div>
        </div>
    </div>

    <!-- ===== 提交工作流 ===== -->
    <div class="card" id="submitCard">
        <h2>📤 提交工作流</h2>
        <div class="form-row">
            <div class="form-group">
                <label>工作流名称</label>
                <input id="wfName" placeholder="例如: rna-seq-pipeline">
            </div>
            <div class="form-group" style="flex:2;">
                <label>工作流定义 (JSON)</label>
                <textarea id="wfJson" placeholder='[{"name":"qc","image":"alpine:latest","command":["echo","QC"]}]'>[
                        {"name": "qc", "image": "alpine:latest", "command": ["echo", "QC passed"]},
                        {"name": "align", "image": "alpine:latest", "command": ["echo", "Alignment done"], "dependsOn": ["qc"]}
                    ]</textarea>
            </div>
        </div>
        <div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="submitWorkflow()">🚀 提交工作流</button>
            <button class="btn btn-success" onclick="loadExample()">📋 加载示例</button>
            <button class="btn btn-warning" onclick="loadComplexExample()">🧬 加载复杂示例</button>
        </div>
    </div>

    <!-- ===== 工作流列表 ===== -->
    <div class="card">
        <h2>
            📋 工作流列表
            <button class="refresh-btn" onclick="loadWorkflows()">🔄 刷新</button>
        </h2>
        <div id="workflowList">
            <div class="empty-state">加载中...</div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 配置
    // ============================================================
    const API_BASE = 'http://localhost:8080';
    let authToken = localStorage.getItem('bio_token') || '';
    let currentUsername = localStorage.getItem('bio_username') || '';
    let currentWorkflowName = '';

    // ============================================================
    // Toast 通知
    // ============================================================
    function showToast(message, type = 'info') {
        const t = document.getElementById('toast');
        t.textContent = message;
        t.className = 'toast ' + type + ' show';
        clearTimeout(t._hide);
        t._hide = setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    // ============================================================
    // 认证相关
    // ============================================================
    function switchLoginTab(tab) {
        document.querySelectorAll('.login-tabs button').forEach(b => b.classList.remove('active'));
        document.querySelector(`.login-tabs button[data-tab="${tab}"]`).classList.add('active');
        document.getElementById('loginForm').classList.toggle('active', tab === 'login');
        document.getElementById('registerForm').classList.toggle('active', tab === 'register');
    }

    function openLoginModal() {
        document.getElementById('loginModal').classList.add('active');
    }

    function closeLoginModal() {
        document.getElementById('loginModal').classList.remove('active');
    }

    async function register() {
        const username = document.getElementById('registerUsername').value.trim();
        const password = document.getElementById('registerPassword').value;
        const password2 = document.getElementById('registerPassword2').value;

        if (!username || !password) {
            showToast('请填写用户名和密码', 'error');
            return;
        }
        if (password !== password2) {
            showToast('两次密码输入不一致', 'error');
            return;
        }

        try {
            const resp = await fetch(API_BASE + '/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await resp.json();
            if (resp.ok) {
                showToast('✅ 注册成功，请登录', 'success');
                switchLoginTab('login');
                document.getElementById('loginUsername').value = username;
                document.getElementById('loginPassword').value = '';
            } else {
                showToast('❌ 注册失败: ' + (data.error || '未知错误'), 'error');
            }
        } catch (e) {
            showToast('❌ 请求失败: ' + e.message, 'error');
        }
    }

    async function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!username || !password) {
            showToast('请填写用户名和密码', 'error');
            return;
        }

        try {
            const resp = await fetch(API_BASE + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await resp.json();
            if (resp.ok) {
                authToken = data.token;
                currentUsername = data.username;
                localStorage.setItem('bio_token', authToken);
                localStorage.setItem('bio_username', currentUsername);
                closeLoginModal();
                updateUI();
                showToast('✅ 登录成功: ' + currentUsername, 'success');
                loadWorkflows();
            } else {
                showToast('❌ 登录失败: ' + (data.error || '用户名或密码错误'), 'error');
            }
        } catch (e) {
            showToast('❌ 请求失败: ' + e.message, 'error');
        }
    }

    function logout() {
        authToken = '';
        currentUsername = '';
        localStorage.removeItem('bio_token');
        localStorage.removeItem('bio_username');
        updateUI();
        showToast('已退出', 'info');
        loadWorkflows();
    }

    function updateUI() {
        const isLoggedIn = !!authToken;
        document.getElementById('loginBtn').style.display = isLoggedIn ? 'none' : 'inline-block';
        document.getElementById('logoutBtn').style.display = isLoggedIn ? 'inline-block' : 'none';
        document.getElementById('userBadge').style.display = isLoggedIn ? 'inline-block' : 'none';
        document.getElementById('usernameDisplay').textContent = currentUsername || '用户';

        // 提交区域可用性
        document.getElementById('submitCard').style.opacity = isLoggedIn ? '1' : '0.6';
        document.getElementById('submitCard').style.pointerEvents = isLoggedIn ? 'auto' : 'none';
    }

    // ============================================================
    // API 请求封装（自动携带 Token）
    // ============================================================
    async function apiRequest(method, path, body = null) {
        const headers = {
            'Content-Type': 'application/json'
        };
        if (authToken) {
            headers['Authorization'] = 'Bearer ' + authToken;
        }

        const options = {
            method: method,
            headers: headers,
        };
        if (body) {
            options.body = JSON.stringify(body);
        }

        const resp = await fetch(API_BASE + path, options);
        const data = await resp.json();

        // 如果是 401，自动退出
        if (resp.status === 401) {
            showToast('⚠️ 会话已过期，请重新登录', 'error');
            logout();
        }

        return { ok: resp.ok, status: resp.status, data };
    }

    // ============================================================
    // 加载示例
    // ============================================================
    function loadExample() {
        const example = [
            { name: "qc", image: "alpine:latest", command: ["echo", "QC: sample passed quality check"] },
            { name: "align", image: "alpine:latest", command: ["echo", "Alignment: reads aligned to reference"], dependsOn: ["qc"] },
            { name: "variant", image: "alpine:latest", command: ["echo", "Variant calling: SNPs detected"], dependsOn: ["align"] }
        ];
        document.getElementById('wfJson').value = JSON.stringify(example, null, 2);
        document.getElementById('wfName').value = 'example-' + Date.now().toString().slice(-6);
        showToast('已加载示例工作流', 'info');
    }

    function loadComplexExample() {
        const example = [
            { name: "fastqc", image: "alpine:latest", command: ["echo", "FastQC: quality check done"] },
            { name: "trimmomatic", image: "alpine:latest", command: ["echo", "Trimmomatic: reads trimmed"], dependsOn: ["fastqc"] },
            { name: "bwa", image: "alpine:latest", command: ["echo", "BWA: reads aligned to reference"], dependsOn: ["trimmomatic"] },
            { name: "samtools", image: "alpine:latest", command: ["echo", "Samtools: BAM sorted and indexed"], dependsOn: ["bwa"] },
            { name: "gatk", image: "alpine:latest", command: ["echo", "GATK: variants called"], dependsOn: ["samtools"] }
        ];
        document.getElementById('wfJson').value = JSON.stringify(example, null, 2);
        document.getElementById('wfName').value = 'pipeline-' + Date.now().toString().slice(-6);
        showToast('已加载复杂示例工作流（5步）', 'info');
    }

    // ============================================================
    // 提交工作流
    // ============================================================
    async function submitWorkflow() {
        if (!authToken) {
            showToast('⚠️ 请先登录', 'error');
            openLoginModal();
            return;
        }

        const name = document.getElementById('wfName').value.trim();
        const jsonStr = document.getElementById('wfJson').value.trim();

        if (!name) {
            showToast('请输入工作流名称', 'error');
            return;
        }
        if (!jsonStr) {
            showToast('请输入工作流定义 (JSON)', 'error');
            return;
        }

        let steps;
        try {
            steps = JSON.parse(jsonStr);
            if (!Array.isArray(steps) || steps.length === 0) {
                throw new Error('Steps must be a non-empty array');
            }
            for (const s of steps) {
                if (!s.name || !s.image || !s.command) {
                    throw new Error('每个步骤必须包含 name, image, command');
                }
            }
        } catch (e) {
            showToast('❌ JSON 格式错误: ' + e.message, 'error');
            return;
        }

        const result = await apiRequest('POST', '/api/workflows', { name, steps });
        if (result.ok) {
            showToast('✅ 工作流 ' + name + ' 提交成功!', 'success');
            document.getElementById('wfName').value = '';
            loadWorkflows();
        } else {
            showToast('❌ 提交失败: ' + (result.data.error || JSON.stringify(result.data)), 'error');
        }
    }

    // ============================================================
    // 加载工作流列表
    // ============================================================
    async function loadWorkflows() {
        const container = document.getElementById('workflowList');
        container.innerHTML = '<div class="empty-state">加载中...</div>';

        const result = await apiRequest('GET', '/api/workflows');
        if (!result.ok) {
            container.innerHTML = '<div class="empty-state">❌ 加载失败: ' + (result.data.error || '') + '</div>';
            return;
        }

        const workflows = result.data.workflows || [];
        if (workflows.length === 0) {
            container.innerHTML = '<div class="empty-state">暂无工作流，点击上方提交一个吧 🚀</div>';
            return;
        }

        let html = `
                <table>
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>状态</th>
                            <th>步骤</th>
                            <th>开始时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

        for (const wf of workflows) {
            const name = wf.metadata?.name || 'unknown';
            const status = wf.status?.phase || 'Pending';
            const startTime = wf.status?.startTime || '-';
            const stepStatus = wf.status?.stepStatus || {};

            let stepsHtml = '';
            const stepNames = Object.keys(stepStatus);
            if (stepNames.length === 0) {
                stepsHtml = '<span class="step-status">等待...</span>';
            } else {
                stepsHtml = stepNames.map(s => {
                    const st = stepStatus[s] || 'Pending';
                    const cls = st.toLowerCase();
                    return `<span class="step-status"><span class="${cls}">●</span> ${s}: ${st}</span>`;
                }).join(' ');
            }

            const statusClass = 'status-' + status;

            html += `
                    <tr>
                        <td><strong>${name}</strong></td>
                        <td><span class="status-badge ${statusClass}">${status}</span></td>
                        <td>${stepsHtml}</td>
                        <td style="font-size:12px;color:#888;">${startTime}</td>
                        <td>
                            <div class="actions">
                                <button class="btn btn-primary btn-sm" onclick="viewWorkflow('${name}')">查看</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteWorkflow('${name}')">删除</button>
                            </div>
                        </td>
                    </tr>
                `;
        }

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    // ============================================================
    // 查看工作流详情
    // ============================================================
    async function viewWorkflow(name) {
        currentWorkflowName = name;
        document.getElementById('detailTitle').textContent = '📄 工作流: ' + name;
        document.getElementById('detailContent').innerHTML = '<div class="empty-state">加载中...</div>';
        document.getElementById('downloadStatus').textContent = '';

        const result = await apiRequest('GET', '/api/workflows/' + name);
        if (!result.ok) {
            document.getElementById('detailContent').innerHTML = '<div class="empty-state">❌ ' + (result.data.error || '获取失败') + '</div>';
        } else {
            document.getElementById('detailContent').innerHTML = `<div class="code-block">${JSON.stringify(result.data.workflow, null, 2)}</div>`;
        }
        document.getElementById('detailModal').classList.add('active');
    }

    function closeDetailModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    // ============================================================
    // 查看日志
    // ============================================================
    async function viewLogs() {
        if (!currentWorkflowName) {
            showToast('请先查看一个工作流', 'error');
            return;
        }

        document.getElementById('logTitle').textContent = '📋 日志: ' + currentWorkflowName;
        document.getElementById('logContent').innerHTML = '<div class="empty-state">加载中...</div>';
        document.getElementById('logModal').classList.add('active');

        const result = await apiRequest('GET', '/api/workflows/' + currentWorkflowName + '/logs');
        if (!result.ok) {
            document.getElementById('logContent').innerHTML = '<div class="empty-state">❌ ' + (result.data.error || '获取失败') + '</div>';
            return;
        }

        const logs = result.data.logs || {};
        const entries = Object.entries(logs);

        if (entries.length === 0) {
            document.getElementById('logContent').innerHTML = '<div class="empty-state">暂无日志</div>';
            return;
        }

        let html = '';
        for (const [step, log] of entries) {
            html += `<div class="log-entry"><span class="step-name">[${step}]</span><span class="log-content">${log}</span></div>`;
        }
        document.getElementById('logContent').innerHTML = html;
    }

    function closeLogModal() {
        document.getElementById('logModal').classList.remove('active');
    }

    // ============================================================
    // 下载结果（模拟）
    // ============================================================
    async function downloadResult() {
        if (!currentWorkflowName) {
            showToast('请先查看一个工作流', 'error');
            return;
        }

        const statusEl = document.getElementById('downloadStatus');
        statusEl.textContent = '⏳ 正在生成结果...';

        // 模拟生成结果文件
        await new Promise(resolve => setTimeout(resolve, 1500));

        const result = await apiRequest('GET', '/api/workflows/' + currentWorkflowName);
        if (!result.ok) {
            statusEl.textContent = '❌ 获取工作流数据失败';
            return;
        }

        const wf = result.data.workflow || {};
        const status = wf.status?.phase || 'unknown';
        const steps = wf.spec?.steps || [];
        const stepStatus = wf.status?.stepStatus || {};

        // 生成结果报告
        const report = {
            workflow: currentWorkflowName,
            status: status,
            generated_at: new Date().toISOString(),
            steps: steps.map(s => ({
                name: s.name,
                image: s.image,
                command: s.command.join(' '),
                status: stepStatus[s.name] || 'Pending',
                dependsOn: s.dependsOn || []
            })),
            summary: {
                total_steps: steps.length,
                completed: Object.values(stepStatus).filter(v => v === 'Completed').length,
                running: Object.values(stepStatus).filter(v => v === 'Running').length,
                pending: Object.values(stepStatus).filter(v => v === 'Pending').length,
                failed: Object.values(stepStatus).filter(v => v === 'Failed').length
            }
        };

        // 创建下载
        const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `workflow-${currentWorkflowName}-result.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        statusEl.textContent = '✅ 下载完成!';
        showToast('📥 结果文件已下载', 'success');
    }

    // ============================================================
    // 删除工作流
    // ============================================================
    async function deleteWorkflow(name) {
        if (!confirm('确定要删除工作流 "' + name + '" 吗？\n（将同时删除所有关联的 Job 和 Pod）')) {
            return;
        }
        const result = await apiRequest('DELETE', '/api/workflows/' + name);
        if (result.ok) {
            showToast('🗑️ 已删除: ' + name, 'success');
            loadWorkflows();
            closeDetailModal();
        } else {
            showToast('❌ 删除失败: ' + (result.data.error || ''), 'error');
        }
    }

    // ============================================================
    // 点击弹窗外关闭
    // ============================================================
    document.querySelectorAll('.modal-overlay').forEach(el => {
        el.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
            }
        });
    });

    // ============================================================
    // 自动刷新 (每 10 秒)
    // ============================================================
    setInterval(loadWorkflows, 10000);

    // ============================================================
    // 初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        if (authToken) {
            updateUI();
            loadWorkflows();
        } else {
            updateUI();
            // 显示登录提示
            document.getElementById('workflowList').innerHTML =
                '<div class="empty-state">🔐 请先 <a href="#" onclick="openLoginModal();return false;">登录</a> 查看工作流</div>';
            document.getElementById('submitCard').style.opacity = '0.6';
            document.getElementById('submitCard').style.pointerEvents = 'none';
            // 自动弹窗登录
            setTimeout(openLoginModal, 500);
        }
    });

    console.log('🧬 BioWorkflow 控制台已加载');
    console.log('💡 默认账号: admin/admin123 或 test/test123');
    console.log('💡 提示: 自动刷新每 10 秒更新一次');
</script>
</body>
</html>
